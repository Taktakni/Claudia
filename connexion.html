<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | MONTPLAISIR LAVAGE AUTO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
:root {
    --bleu-fonce: #071B3B;
    --bleu-electrique: #0066FF;
    --orange: #FF8C00;
    --blanc: #FFFFFF;
    --gris-clair: #f8f9fa;
    --gris-border: #e1e5eb;
    --rouge: #ff4757;
    --vert: #25D366;
    --shadow: 0 10px 40px rgba(0,102,255,0.15);
    --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,var(--bleu-fonce),#0a2a5e);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
}
a { text-decoration:none; color:inherit; }

.page-header {
    width:100%; max-width:450px;
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 0; margin-bottom:20px;
}
.logo { color:var(--blanc); font-size:1.2rem; font-weight:800; display:flex; align-items:center; gap:8px; }
.logo i { color:var(--orange); font-size:1.4rem; }
.btn-back {
    color:var(--blanc); background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    padding:8px 16px; border-radius:50px; font-size:0.8rem;
    display:flex; align-items:center; gap:6px; transition:var(--transition);
}
.btn-back:hover { background:rgba(255,255,255,0.2); }

.auth-card {
    width:100%; max-width:450px;
    background:var(--blanc); border-radius:24px;
    padding:50px 40px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
    position:relative; overflow:hidden;
}
.auth-card::before {
    content:''; position:absolute; top:0; left:0;
    width:100%; height:5px;
    background:linear-gradient(90deg,var(--bleu-electrique),var(--orange));
}
.auth-title { text-align:center; margin-bottom:35px; }
.auth-title h1 { font-size:1.6rem; font-weight:800; color:var(--bleu-fonce); margin-bottom:6px; }
.auth-title p { color:#666; font-size:0.9rem; }

.form-group { margin-bottom:22px; position:relative; }
.form-group label { display:block; font-size:0.85rem; font-weight:600; color:var(--bleu-fonce); margin-bottom:8px; }
.form-group input {
    width:100%; padding:15px 18px;
    border:2px solid var(--gris-border); border-radius:12px;
    font-family:'Poppins',sans-serif; font-size:0.95rem;
    color:var(--bleu-fonce); transition:var(--transition); outline:none;
}
.form-group input:focus {
    border-color:var(--bleu-electrique);
    box-shadow:0 0 0 4px rgba(0,102,255,0.1);
}
.form-group .form-error { color:var(--rouge); font-size:0.78rem; margin-top:5px; display:none; }
.form-group.error input { border-color:var(--rouge); }
.form-group.error .form-error { display:block; }

.password-toggle {
    position:absolute; right:16px; top:42px;
    background:none; border:none; color:#999;
    font-size:1.1rem; cursor:pointer; transition:var(--transition);
}
.password-toggle:hover { color:var(--bleu-electrique); }

.btn-submit {
    width:100%; padding:16px;
    background:linear-gradient(135deg,var(--bleu-electrique),#0052cc);
    color:var(--blanc); border:none; border-radius:12px;
    font-size:1rem; font-weight:700; font-family:'Poppins',sans-serif;
    cursor:pointer; transition:var(--transition);
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:5px;
}
.btn-submit:hover { transform:translateY(-2px); box-shadow:0 12px 35px rgba(0,102,255,0.4); }
.btn-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

.auth-footer { text-align:center; margin-top:25px; font-size:0.88rem; color:#666; }
.auth-footer a { color:var(--bleu-electrique); font-weight:600; transition:var(--transition); }
.auth-footer a:hover { color:var(--orange); }

.alert {
    padding:12px 16px; border-radius:10px; font-size:0.85rem;
    font-weight:500; margin-bottom:20px; display:none;
    align-items:center; gap:8px;
}
.alert.error { background:rgba(255,71,87,0.1); color:var(--rouge); border:1px solid rgba(255,71,87,0.2); }
.alert.success { background:rgba(37,211,102,0.1); color:var(--vert); border:1px solid rgba(37,211,102,0.2); }
.alert.active { display:flex; }

.divider { display:flex; align-items:center; gap:15px; margin:25px 0; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--gris-border); }
.divider span { font-size:0.8rem; color:#999; font-weight:500; }

@media(max-width:500px) {
    .auth-card { padding:35px 22px; }
    .auth-title h1 { font-size:1.3rem; }
}
    </style>
</head>
<body>

    <header class="page-header">
        <a href="index.html" class="logo"><i class="fas fa-car-side"></i> MONTPLAISIR</a>
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Accueil</a>
    </header>

    <div class="auth-card">
        <div class="auth-title">
            <h1><i class="fas fa-sign-in-alt"></i> Connexion</h1>
            <p>Accédez à votre espace personnel</p>
        </div>

        <div class="alert error" id="alertError"><i class="fas fa-exclamation-circle"></i> <span id="errorMsg"></span></div>
        <div class="alert success" id="alertSuccess"><i class="fas fa-check-circle"></i> <span id="successMsg"></span></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="phone"><i class="fas fa-phone"></i> Numéro de téléphone</label>
                <input type="tel" id="phone" placeholder="07XX XX XX XX" required>
                <span class="form-error">Veuillez entrer votre numéro de téléphone</span>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
                <input type="password" id="password" placeholder="Votre mot de passe" required>
                <button type="button" class="password-toggle" onclick="togglePassword()"><i class="fas fa-eye"></i></button>
                <span class="form-error">Veuillez entrer votre mot de passe</span>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> Se Connecter
            </button>
        </form>

        <div class="divider"><span>ou</span></div>

        <p class="auth-footer">
            Pas encore de compte ? <a href="inscription.html">S'inscrire gratuitement</a>
        </p>
    </div>

    <script src="db-clients.js"></script>
    <script>
    'use strict';

    // Si déjà connecté, rediriger vers profil
    if (ClientsDB.isLoggedIn()) {
        window.location.href = 'profile.html';
    }

    const form = document.getElementById('loginForm');
    const alertError = document.getElementById('alertError');
    const alertSuccess = document.getElementById('alertSuccess');

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        hideAlerts();

        const phone = document.getElementById('phone').value.trim().replace(/\s/g, '');
        const password = document.getElementById('password').value;

        // Validation
        let valid = true;
        document.querySelectorAll('.form-group').forEach(g => g.classList.remove('error'));

        if (!phone || phone.length < 10) {
            document.getElementById('phone').parentElement.classList.add('error');
            valid = false;
        }
        if (!password) {
            document.getElementById('password').parentElement.classList.add('error');
            valid = false;
        }

        if (!valid) return;

        // Tentative de connexion
        const result = ClientsDB.login(phone, password);

        if (result.error) {
            showAlert('error', result.error);
            return;
        }

        showAlert('success', 'Connexion réussie ! Redirection...');
        document.getElementById('submitBtn').disabled = true;

        setTimeout(() => {
            window.location.href = 'profile.html';
        }, 1200);
    });

    function hideAlerts() {
        alertError.classList.remove('active');
        alertSuccess.classList.remove('active');
    }

    function showAlert(type, msg) {
        if (type === 'error') {
            document.getElementById('errorMsg').textContent = msg;
            alertError.classList.add('active');
        } else {
            document.getElementById('successMsg').textContent = msg;
            alertSuccess.classList.add('active');
        }
    }

    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.querySelector('.password-toggle i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Clear error on focus
    document.querySelectorAll('.form-group input').forEach(el => {
        el.addEventListener('focus', () => {
            el.parentElement.classList.remove('error');
            hideAlerts();
        });
    });
    </script>
</body>
</html>
