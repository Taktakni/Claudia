<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | MONTPLAISIR LAVAGE AUTO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
:root {
    --bleu-fonce: #071B3B;
    --bleu-electrique: #0066FF;
    --orange: #FF8C00;
    --blanc: #FFFFFF;
    --gris-clair: #f8f9fa;
    --gris-border: #e1e5eb;
    --rouge: #ff4757;
    --vert: #25D366;
    --shadow: 0 10px 40px rgba(0,102,255,0.15);
    --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,var(--bleu-fonce),#0a2a5e);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
}
a { text-decoration:none; color:inherit; }

.page-header {
    width:100%; max-width:550px;
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 0; margin-bottom:20px;
}
.logo { color:var(--blanc); font-size:1.2rem; font-weight:800; display:flex; align-items:center; gap:8px; }
.logo i { color:var(--orange); font-size:1.4rem; }
.btn-back {
    color:var(--blanc); background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    padding:8px 16px; border-radius:50px; font-size:0.8rem;
    display:flex; align-items:center; gap:6px; transition:var(--transition);
}
.btn-back:hover { background:rgba(255,255,255,0.2); }

.auth-card {
    width:100%; max-width:550px;
    background:var(--blanc); border-radius:24px;
    padding:45px 40px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
    position:relative; overflow:hidden;
}
.auth-card::before {
    content:''; position:absolute; top:0; left:0;
    width:100%; height:5px;
    background:linear-gradient(90deg,var(--bleu-electrique),var(--orange));
}
.auth-title { text-align:center; margin-bottom:30px; }
.auth-title h1 { font-size:1.6rem; font-weight:800; color:var(--bleu-fonce); margin-bottom:6px; }
.auth-title p { color:#666; font-size:0.9rem; }

.form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-bottom:20px; }
.form-group { position:relative; }
.form-group.full-width { grid-column:1/-1; }
.form-group label { display:block; font-size:0.82rem; font-weight:600; color:var(--bleu-fonce); margin-bottom:6px; }
.form-group label .req { color:var(--rouge); }
.form-group input, .form-group select {
    width:100%; padding:13px 16px;
    border:2px solid var(--gris-border); border-radius:12px;
    font-family:'Poppins',sans-serif; font-size:0.9rem;
    color:var(--bleu-fonce); transition:var(--transition); outline:none;
}
.form-group input:focus, .form-group select:focus {
    border-color:var(--bleu-electrique);
    box-shadow:0 0 0 4px rgba(0,102,255,0.1);
}
.form-group .form-error { color:var(--rouge); font-size:0.75rem; margin-top:4px; display:none; }
.form-group.error input, .form-group.error select { border-color:var(--rouge); }
.form-group.error .form-error { display:block; }

.password-toggle {
    position:absolute; right:14px; top:36px;
    background:none; border:none; color:#999;
    font-size:1rem; cursor:pointer; transition:var(--transition);
}
.password-toggle:hover { color:var(--bleu-electrique); }

.btn-submit {
    width:100%; padding:16px;
    background:linear-gradient(135deg,var(--bleu-electrique),#0052cc);
    color:var(--blanc); border:none; border-radius:12px;
    font-size:1rem; font-weight:700; font-family:'Poppins',sans-serif;
    cursor:pointer; transition:var(--transition);
    display:flex; align-items:center; justify-content:center; gap:10px;
}
.btn-submit:hover { transform:translateY(-2px); box-shadow:0 12px 35px rgba(0,102,255,0.4); }
.btn-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

.auth-footer { text-align:center; margin-top:20px; font-size:0.88rem; color:#666; }
.auth-footer a { color:var(--bleu-electrique); font-weight:600; transition:var(--transition); }
.auth-footer a:hover { color:var(--orange); }

.alert { padding:12px 16px; border-radius:10px; font-size:0.85rem; font-weight:500; margin-bottom:20px; display:none; }
.alert.error { background:rgba(255,71,87,0.1); color:var(--rouge); border:1px solid rgba(255,71,87,0.2); }
.alert.success { background:rgba(37,211,102,0.1); color:var(--vert); border:1px solid rgba(37,211,102,0.2); }
.alert.active { display:block; }

@media(max-width:600px) {
    .form-grid { grid-template-columns:1fr; }
    .auth-card { padding:30px 20px; }
    .auth-title h1 { font-size:1.3rem; }
}
    </style>
</head>
<body>

    <header class="page-header">
        <a href="index.html" class="logo"><i class="fas fa-car-side"></i> MONTPLAISIR</a>
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Accueil</a>
    </header>

    <div class="auth-card">
        <div class="auth-title">
            <h1><i class="fas fa-user-plus"></i> Créer un Compte</h1>
            <p>Inscrivez-vous pour gérer vos rendez-vous facilement</p>
        </div>

        <div class="alert error" id="alertError"></div>
        <div class="alert success" id="alertSuccess"></div>

        <form id="registerForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Prénom <span class="req">*</span></label>
                    <input type="text" id="firstName" placeholder="Votre prénom" required>
                    <span class="form-error">Prénom requis</span>
                </div>
                <div class="form-group">
                    <label>Nom <span class="req">*</span></label>
                    <input type="text" id="lastName" placeholder="Votre nom" required>
                    <span class="form-error">Nom requis</span>
                </div>
                <div class="form-group">
                    <label>Téléphone <span class="req">*</span></label>
                    <input type="tel" id="phone" placeholder="07XX XX XX XX" required>
                    <span class="form-error">Numéro valide requis (min 10 chiffres)</span>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="votre@email.com">
                    <span class="form-error">Email invalide</span>
                </div>
                <div class="form-group">
                    <label>Mot de passe <span class="req">*</span></label>
                    <input type="password" id="password" placeholder="Min 6 caractères" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password')"><i class="fas fa-eye"></i></button>
                    <span class="form-error">Min 6 caractères requis</span>
                </div>
                <div class="form-group">
                    <label>Confirmer le mot de passe <span class="req">*</span></label>
                    <input type="password" id="confirmPassword" placeholder="Confirmez..." required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')"><i class="fas fa-eye"></i></button>
                    <span class="form-error">Les mots de passe ne correspondent pas</span>
                </div>
                <div class="form-group">
                    <label>Marque du véhicule</label>
                    <input type="text" id="car" placeholder="Ex: Toyota, Peugeot...">
                </div>
                <div class="form-group">
                    <label>Type du véhicule</label>
                    <select id="carType">
                        <option value="">-- Optionnel --</option>
                        <option value="Berline">Berline</option>
                        <option value="SUV">SUV</option>
                        <option value="4x4">4x4</option>
                        <option value="Citadine">Citadine</option>
                        <option value="Utilitaire">Utilitaire</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>Adresse</label>
                    <input type="text" id="address" placeholder="Votre adresse (optionnel)">
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-user-plus"></i> S'inscrire
            </button>
        </form>

        <p class="auth-footer">
            Déjà inscrit ? <a href="connexion.html">Se connecter</a>
        </p>
    </div>

    <script src="db-clients.js"></script>
    <script>
    'use strict';

    // Si déjà connecté, rediriger vers profil
    if (ClientsDB.isLoggedIn()) {
        window.location.href = 'profile.html';
    }

    const form = document.getElementById('registerForm');
    const alertError = document.getElementById('alertError');
    const alertSuccess = document.getElementById('alertSuccess');

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        hideAlerts();

        const data = {
            firstName: document.getElementById('firstName').value.trim(),
            lastName: document.getElementById('lastName').value.trim(),
            phone: document.getElementById('phone').value.trim().replace(/\s/g, ''),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            car: document.getElementById('car').value.trim(),
            carType: document.getElementById('carType').value,
            address: document.getElementById('address').value.trim()
        };

        const confirmPass = document.getElementById('confirmPassword').value;

        // Validation
        let valid = true;
        document.querySelectorAll('.form-group').forEach(g => g.classList.remove('error'));

        if (!data.firstName || data.firstName.length < 2) { setErr('firstName'); valid = false; }
        if (!data.lastName || data.lastName.length < 2) { setErr('lastName'); valid = false; }
        if (!data.phone || data.phone.length < 10) { setErr('phone'); valid = false; }
        if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) { setErr('email'); valid = false; }
        if (!data.password || data.password.length < 6) { setErr('password'); valid = false; }
        if (data.password !== confirmPass) { setErr('confirmPassword'); valid = false; }

        if (!valid) return;

        // Direct registration (no OTP)
        const result = ClientsDB.register(data);

        if (result.error) {
            showAlert('error', result.error);
            return;
        }

        // Success
        showAlert('success', 'Inscription réussie ! Redirection vers votre profil...');
        document.getElementById('submitBtn').disabled = true;

        setTimeout(() => {
            window.location.href = 'profile.html';
        }, 1500);
    });

    function setErr(id) { document.getElementById(id).parentElement.classList.add('error'); }
    function hideAlerts() { alertError.classList.remove('active'); alertSuccess.classList.remove('active'); }
    function showAlert(type, msg) {
        const el = type === 'error' ? alertError : alertSuccess;
        el.textContent = msg;
        el.classList.add('active');
    }

    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Clear error on focus
    document.querySelectorAll('.form-group input, .form-group select').forEach(el => {
        el.addEventListener('focus', () => el.parentElement.classList.remove('error'));
    });
    </script>
</body>
</html>
