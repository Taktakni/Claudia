<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil | MONTPLAISIR LAVAGE AUTO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
:root {
    --bleu-fonce: #071B3B;
    --bleu-electrique: #0066FF;
    --orange: #FF8C00;
    --blanc: #FFFFFF;
    --gris-clair: #f0f2f5;
    --gris-border: #e1e5eb;
    --rouge: #ff4757;
    --vert: #25D366;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-hover: 0 8px 30px rgba(0,102,255,0.15);
    --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Poppins',sans-serif; background:var(--gris-clair); color:var(--bleu-fonce); min-height:100vh; }
a { text-decoration:none; color:inherit; }
button { cursor:pointer; font-family:inherit; }

/* HEADER */
.profile-header {
    background:linear-gradient(135deg,var(--bleu-fonce),#0a2a5e);
    padding:20px 0; position:sticky; top:0; z-index:100;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
}
.header-container {
    max-width:1100px; margin:0 auto; padding:0 20px;
    display:flex; align-items:center; justify-content:space-between;
}
.logo { color:var(--blanc); font-size:1.2rem; font-weight:800; display:flex; align-items:center; gap:8px; }
.logo i { color:var(--orange); font-size:1.4rem; }
.header-nav { display:flex; align-items:center; gap:15px; }
.header-nav a {
    color:var(--blanc); font-size:0.85rem; font-weight:500;
    padding:8px 16px; border-radius:8px; transition:var(--transition);
}
.header-nav a:hover { background:rgba(255,255,255,0.1); }
.btn-logout {
    background:rgba(255,71,87,0.15); color:var(--rouge);
    border:1px solid rgba(255,71,87,0.3); padding:8px 16px;
    border-radius:8px; font-size:0.83rem; font-weight:600;
    display:flex; align-items:center; gap:6px; transition:var(--transition);
}
.btn-logout:hover { background:var(--rouge); color:var(--blanc); }

/* MAIN */
.main { max-width:1100px; margin:0 auto; padding:30px 20px; }

/* PROFILE HERO */
.profile-hero {
    background:var(--blanc); border-radius:20px; padding:40px;
    box-shadow:var(--shadow); display:flex; align-items:center;
    gap:30px; margin-bottom:30px; position:relative; overflow:hidden;
}
.profile-hero::before {
    content:''; position:absolute; top:0; left:0;
    width:100%; height:5px;
    background:linear-gradient(90deg,var(--bleu-electrique),var(--orange));
}
.avatar {
    width:90px; height:90px; border-radius:50%;
    background:linear-gradient(135deg,var(--bleu-electrique),var(--orange));
    display:flex; align-items:center; justify-content:center;
    font-size:2rem; font-weight:800; color:var(--blanc);
    flex-shrink:0;
}
.profile-info h2 { font-size:1.5rem; font-weight:800; margin-bottom:4px; }
.profile-info p { color:#666; font-size:0.9rem; }
.profile-info .member-since {
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(0,102,255,0.08); color:var(--bleu-electrique);
    padding:5px 12px; border-radius:20px; font-size:0.78rem;
    font-weight:600; margin-top:8px;
}

/* STATS */
.profile-stats {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px; margin-bottom:30px;
}
.stat-card {
    background:var(--blanc); border-radius:16px; padding:25px;
    box-shadow:var(--shadow); text-align:center; transition:var(--transition);
}
.stat-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); }
.stat-card .stat-icon {
    width:50px; height:50px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.3rem; margin:0 auto 12px;
}
.stat-card .stat-icon.blue { background:rgba(0,102,255,0.1); color:var(--bleu-electrique); }
.stat-card .stat-icon.orange { background:rgba(255,140,0,0.1); color:var(--orange); }
.stat-card .stat-icon.green { background:rgba(37,211,102,0.1); color:var(--vert); }
.stat-card .stat-value { font-size:1.8rem; font-weight:800; color:var(--bleu-fonce); }
.stat-card .stat-label { font-size:0.82rem; color:#888; margin-top:3px; }

/* TABS */
.tabs-container { margin-bottom:30px; }
.tabs-nav {
    display:flex; gap:5px; background:var(--blanc);
    border-radius:12px; padding:5px; box-shadow:var(--shadow);
    margin-bottom:20px; overflow-x:auto;
}
.tab-btn {
    padding:12px 20px; border:none; background:transparent;
    border-radius:8px; font-size:0.85rem; font-weight:600;
    color:#666; transition:var(--transition); white-space:nowrap;
    display:flex; align-items:center; gap:8px;
}
.tab-btn.active { background:var(--bleu-electrique); color:var(--blanc); box-shadow:0 4px 15px rgba(0,102,255,0.3); }
.tab-btn:hover:not(.active) { background:var(--gris-clair); color:var(--bleu-fonce); }

.tab-content { display:none; }
.tab-content.active { display:block; }

/* RDV LIST */
.rdv-list { display:flex; flex-direction:column; gap:15px; }
.rdv-card {
    background:var(--blanc); border-radius:16px; padding:20px 25px;
    box-shadow:var(--shadow); display:flex; align-items:center;
    justify-content:space-between; gap:20px; transition:var(--transition);
}
.rdv-card:hover { box-shadow:var(--shadow-hover); }
.rdv-info { display:flex; align-items:center; gap:15px; }
.rdv-date-badge {
    width:55px; height:55px; border-radius:12px;
    background:linear-gradient(135deg,rgba(0,102,255,0.1),rgba(0,102,255,0.05));
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; flex-shrink:0;
}
.rdv-date-badge .day { font-size:1.2rem; font-weight:800; color:var(--bleu-electrique); line-height:1; }
.rdv-date-badge .month { font-size:0.65rem; color:#888; text-transform:uppercase; font-weight:600; }
.rdv-details h4 { font-size:0.95rem; font-weight:700; margin-bottom:3px; }
.rdv-details p { font-size:0.8rem; color:#888; display:flex; align-items:center; gap:5px; }
.rdv-status {
    padding:6px 14px; border-radius:20px; font-size:0.73rem;
    font-weight:600; flex-shrink:0;
}
.rdv-status.pending { background:rgba(255,140,0,0.1); color:var(--orange); }
.rdv-status.confirmed { background:rgba(0,102,255,0.1); color:var(--bleu-electrique); }
.rdv-status.completed { background:rgba(37,211,102,0.1); color:var(--vert); }
.rdv-status.cancelled { background:rgba(255,71,87,0.1); color:var(--rouge); }

.empty-state {
    text-align:center; padding:50px 20px; color:#999;
}
.empty-state i { font-size:3rem; margin-bottom:15px; opacity:0.3; }
.empty-state p { font-size:0.95rem; margin-bottom:15px; }
.btn-action {
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 24px; background:linear-gradient(135deg,var(--bleu-electrique),#0052cc);
    color:var(--blanc); border:none; border-radius:10px;
    font-size:0.88rem; font-weight:600; transition:var(--transition);
}
.btn-action:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(0,102,255,0.3); }

/* EDIT FORM */
.edit-section {
    background:var(--blanc); border-radius:16px; padding:30px;
    box-shadow:var(--shadow);
}
.edit-section h3 { font-size:1.1rem; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
.form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-bottom:20px; }
.form-group { position:relative; }
.form-group.full { grid-column:1/-1; }
.form-group label { display:block; font-size:0.82rem; font-weight:600; color:var(--bleu-fonce); margin-bottom:6px; }
.form-group input, .form-group select {
    width:100%; padding:12px 15px; border:1.5px solid var(--gris-border);
    border-radius:10px; font-size:0.9rem; outline:none; transition:var(--transition);
}
.form-group input:focus, .form-group select:focus {
    border-color:var(--bleu-electrique); box-shadow:0 0 0 3px rgba(0,102,255,0.08);
}
.btn-save {
    padding:12px 28px; background:linear-gradient(135deg,var(--bleu-electrique),#0052cc);
    color:var(--blanc); border:none; border-radius:10px;
    font-size:0.9rem; font-weight:600; transition:var(--transition);
    display:inline-flex; align-items:center; gap:8px;
}
.btn-save:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(0,102,255,0.3); }
.btn-save-pass {
    padding:12px 28px; background:linear-gradient(135deg,var(--orange),#e07800);
    color:var(--blanc); border:none; border-radius:10px;
    font-size:0.9rem; font-weight:600; transition:var(--transition);
    display:inline-flex; align-items:center; gap:8px;
}
.btn-save-pass:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(255,140,0,0.3); }

.alert {
    padding:12px 16px; border-radius:10px; font-size:0.85rem;
    font-weight:500; margin-bottom:15px; display:none;
    align-items:center; gap:8px;
}
.alert.error { background:rgba(255,71,87,0.1); color:var(--rouge); }
.alert.success { background:rgba(37,211,102,0.1); color:var(--vert); }
.alert.active { display:flex; }

/* RESPONSIVE */
@media(max-width:768px) {
    .profile-hero { flex-direction:column; text-align:center; padding:30px 20px; }
    .form-grid { grid-template-columns:1fr; }
    .rdv-card { flex-direction:column; align-items:flex-start; }
    .header-nav a span { display:none; }
    .tabs-nav { gap:2px; }
    .tab-btn { padding:10px 14px; font-size:0.8rem; }
}
@media(max-width:480px) {
    .profile-stats { grid-template-columns:1fr; }
    .header-container { gap:10px; }
}
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="profile-header">
        <div class="header-container">
            <a href="index.html" class="logo"><i class="fas fa-car-side"></i> MONTPLAISIR</a>
            <nav class="header-nav">
                <a href="index.html"><i class="fas fa-home"></i> <span data-lang="profile_home">Accueil</span></a>
                <a href="reservation.html"><i class="fas fa-calendar-plus"></i> <span data-lang="profile_reserve">Réserver</span></a>
                <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span data-lang="profile_logout">Déconnexion</span></button>
            </nav>
        </div>
    </header>

    <!-- MAIN -->
    <main class="main">

        <!-- Profile Hero -->
        <div class="profile-hero">
            <div class="avatar" id="avatarDisplay">--</div>
            <div class="profile-info">
                <h2 id="profileName">Chargement...</h2>
                <p id="profilePhone"></p>
                <span class="member-since"><i class="fas fa-calendar-alt"></i> <span id="memberSince" data-lang="profile_member_since"></span></span>
            </div>
        </div>

        <!-- Stats -->
        <div class="profile-stats">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-calendar-check"></i></div>
                <div class="stat-value" id="statRdv">0</div>
                <div class="stat-label" data-lang="profile_rdv">Rendez-vous</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fas fa-star"></i></div>
                <div class="stat-value" id="statPoints">0</div>
                <div class="stat-label" data-lang="profile_points">Points fidélité</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-car"></i></div>
                <div class="stat-value" id="statVisits">0</div>
                <div class="stat-label" data-lang="profile_visits">Visites totales</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs-container">
            <div class="tabs-nav">
                <button class="tab-btn active" data-tab="rdv"><i class="fas fa-calendar-alt"></i> <span data-lang="profile_tab_rdv">Mes RDV</span></button>
                <button class="tab-btn" data-tab="edit"><i class="fas fa-user-edit"></i> <span data-lang="profile_tab_edit">Mon Profil</span></button>
                <button class="tab-btn" data-tab="password"><i class="fas fa-lock"></i> <span data-lang="profile_tab_pass">Mot de passe</span></button>
            </div>

            <!-- Tab: Mes RDV -->
            <div class="tab-content active" id="tab-rdv">
                <div class="rdv-list" id="rdvList"></div>
            </div>

            <!-- Tab: Modifier Profil -->
            <div class="tab-content" id="tab-edit">
                <div class="edit-section">
                    <h3><i class="fas fa-user-edit"></i> <span data-lang="profile_edit_title">Modifier mes informations</span></h3>
                    <div class="alert success" id="editSuccess"><i class="fas fa-check-circle"></i> <span data-lang="profile_edit_success">Profil mis à jour avec succès !</span></div>
                    <form id="editForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label data-lang="profile_edit_firstname">Prénom</label>
                                <input type="text" id="editFirstName">
                            </div>
                            <div class="form-group">
                                <label data-lang="profile_edit_lastname">Nom</label>
                                <input type="text" id="editLastName">
                            </div>
                            <div class="form-group">
                                <label data-lang="profile_edit_email">Email</label>
                                <input type="email" id="editEmail">
                            </div>
                            <div class="form-group">
                                <label data-lang="profile_edit_phone">Téléphone</label>
                                <input type="tel" id="editPhone" disabled style="opacity:0.6;">
                            </div>
                            <div class="form-group">
                                <label data-lang="profile_edit_car">Véhicule</label>
                                <input type="text" id="editCar" placeholder="Marque du véhicule" data-lang-placeholder="profile_edit_car">
                            </div>
                            <div class="form-group">
                                <label data-lang="profile_edit_cartype">Type véhicule</label>
                                <select id="editCarType">
                                    <option value="">--</option>
                                    <option value="Berline">Berline</option>
                                    <option value="SUV">SUV</option>
                                    <option value="4x4">4x4</option>
                                    <option value="Citadine">Citadine</option>
                                    <option value="Utilitaire">Utilitaire</option>
                                    <option value="Autre">Autre</option>
                                </select>
                            </div>
                            <div class="form-group full">
                                <label data-lang="profile_edit_address">Adresse</label>
                                <input type="text" id="editAddress" placeholder="Votre adresse" data-lang-placeholder="profile_edit_address">
                            </div>
                        </div>
                        <button type="submit" class="btn-save"><i class="fas fa-save"></i> <span data-lang="profile_edit_save">Enregistrer</span></button>
                    </form>
                </div>
            </div>

            <!-- Tab: Mot de passe -->
            <div class="tab-content" id="tab-password">
                <div class="edit-section">
                    <h3><i class="fas fa-lock"></i> <span data-lang="profile_pass_title">Changer le mot de passe</span></h3>
                    <div class="alert error" id="passError"></div>
                    <div class="alert success" id="passSuccess"><i class="fas fa-check-circle"></i> <span data-lang="profile_pass_success">Mot de passe modifié avec succès !</span></div>
                    <form id="passwordForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label data-lang="profile_pass_current">Mot de passe actuel</label>
                                <input type="password" id="currentPass" required>
                            </div>
                            <div class="form-group">
                                <label data-lang="profile_pass_new">Nouveau mot de passe</label>
                                <input type="password" id="newPass" required placeholder="Min 6 caractères" data-lang-placeholder="profile_pass_new">
                            </div>
                            <div class="form-group">
                                <label data-lang="profile_pass_confirm">Confirmer le nouveau</label>
                                <input type="password" id="confirmNewPass" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-save-pass"><i class="fas fa-key"></i> <span data-lang="profile_pass_btn">Changer</span></button>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <script src="db.js"></script>
    <script src="db-clients.js"></script>
    <script>
    'use strict';

    // Vérifier connexion
    if (!ClientsDB.isLoggedIn()) {
        window.location.href = 'connexion.html';
    }

    const user = ClientsDB.getCurrentUser();
    if (!user) {
        ClientsDB.logout();
        window.location.href = 'connexion.html';
    }

    // ================================== //
    // AFFICHAGE PROFIL                   //
    // ================================== //
    function loadProfile() {
        const u = ClientsDB.getCurrentUser();
        document.getElementById('avatarDisplay').textContent = u.avatar;
        document.getElementById('profileName').textContent = u.firstName + ' ' + u.lastName;
        document.getElementById('profilePhone').textContent = u.phone + (u.email ? ' • ' + u.email : '');
        document.getElementById('memberSince').textContent = 'Membre depuis ' + new Date(u.createdAt).toLocaleDateString('fr-FR', { month:'long', year:'numeric' });

        // Stats
        const myRdv = ClientsDB.getMyAppointments();
        document.getElementById('statRdv').textContent = myRdv.length;
        document.getElementById('statPoints').textContent = u.loyaltyPoints;
        document.getElementById('statVisits').textContent = u.totalVisits;

        // RDV list
        renderRdvList(myRdv);

        // Edit form
        document.getElementById('editFirstName').value = u.firstName;
        document.getElementById('editLastName').value = u.lastName;
        document.getElementById('editEmail').value = u.email || '';
        document.getElementById('editPhone').value = u.phone;
        document.getElementById('editCar').value = u.car || '';
        document.getElementById('editCarType').value = u.carType || '';
        document.getElementById('editAddress').value = u.address || '';
    }

    function renderRdvList(rdvs) {
        const container = document.getElementById('rdvList');
        if (rdvs.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-calendar-times"></i>
                    <p data-lang="profile_no_rdv">Aucun rendez-vous pour le moment</p>
                    <a href="reservation.html" class="btn-action"><i class="fas fa-plus"></i> <span data-lang="profile_take_rdv">Prendre un rendez-vous</span></a>
                </div>`;
            Lang.applyToPage();
            return;
        }

        const statusLabels = { pending:'En attente', confirmed:'Confirmé', completed:'Terminé', cancelled:'Annulé' };
        container.innerHTML = rdvs.map(rdv => {
            const d = new Date(rdv.date);
            const day = d.getDate();
            const month = d.toLocaleDateString('fr-FR', { month:'short' });
            return `
                <div class="rdv-card">
                    <div class="rdv-info">
                        <div class="rdv-date-badge">
                            <span class="day">${day}</span>
                            <span class="month">${month}</span>
                        </div>
                        <div class="rdv-details">
                            <h4>${rdv.service}</h4>
                            <p><i class="fas fa-clock"></i> ${rdv.time} &nbsp;|&nbsp; <i class="fas fa-car"></i> ${rdv.carBrand} (${rdv.carType})</p>
                        </div>
                    </div>
                    <span class="rdv-status ${rdv.status}">${statusLabels[rdv.status] || rdv.status}</span>
                </div>`;
        }).join('');
    }

    loadProfile();

    // ================================== //
    // TABS                               //
    // ================================== //
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // ================================== //
    // EDIT PROFILE                       //
    // ================================== //
    document.getElementById('editForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const result = ClientsDB.updateProfile({
            firstName: document.getElementById('editFirstName').value.trim(),
            lastName: document.getElementById('editLastName').value.trim(),
            email: document.getElementById('editEmail').value.trim(),
            car: document.getElementById('editCar').value.trim(),
            carType: document.getElementById('editCarType').value,
            address: document.getElementById('editAddress').value.trim()
        });

        if (result.success) {
            document.getElementById('editSuccess').classList.add('active');
            setTimeout(() => document.getElementById('editSuccess').classList.remove('active'), 3000);
            loadProfile();
        }
    });

    // ================================== //
    // CHANGE PASSWORD                    //
    // ================================== //
    document.getElementById('passwordForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const errEl = document.getElementById('passError');
        const sucEl = document.getElementById('passSuccess');
        errEl.classList.remove('active');
        sucEl.classList.remove('active');

        const current = document.getElementById('currentPass').value;
        const newP = document.getElementById('newPass').value;
        const confirm = document.getElementById('confirmNewPass').value;

        if (newP.length < 6) {
            errEl.textContent = 'Le nouveau mot de passe doit contenir au moins 6 caractères.';
            errEl.classList.add('active');
            return;
        }
        if (newP !== confirm) {
            errEl.textContent = 'Les mots de passe ne correspondent pas.';
            errEl.classList.add('active');
            return;
        }

        const result = ClientsDB.changePassword(current, newP);
        if (result.error) {
            errEl.textContent = result.error;
            errEl.classList.add('active');
        } else {
            sucEl.classList.add('active');
            document.getElementById('passwordForm').reset();
            setTimeout(() => sucEl.classList.remove('active'), 3000);
        }
    });

    // ================================== //
    // LOGOUT                             //
    // ================================== //
    document.getElementById('logoutBtn').addEventListener('click', () => {
        ClientsDB.logout();
        window.location.href = 'index.html';
    });
    </script>

    <!-- Language Toggle Button -->
    <button id="langToggleBtn" onclick="Lang.toggle()" style="position:fixed;bottom:25px;left:25px;z-index:9999;background:linear-gradient(135deg,var(--bleu-electrique),#0052cc);color:#fff;border:none;padding:12px 20px;border-radius:50px;font-family:'Poppins',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;box-shadow:0 5px 20px rgba(0,102,255,0.3);display:flex;align-items:center;gap:8px;transition:all 0.3s ease;">
